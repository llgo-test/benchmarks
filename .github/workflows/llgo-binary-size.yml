name: LLGo binary size

on:
  push:
    branches:
      - main
    paths-ignore:
      - ci/llgo-size/site/**
      - ci/llgo-size/publish.sh
      - ci/llgo-size/publish-site.sh
      - ci/llgo-size/prepare-pages-branch.sh
      - ci/llgo-performance/**
      - ci/llgo-compatibility/**
      - cmd/bent/configs/benchmarks-llgo-performance.toml
      - cmd/bent/configs/configurations-llgo-performance.toml
      - cmd/bent/configs/benchmarks-llgo-compatibility.toml
      - cmd/bent/configs/configurations-llgo-compatibility.toml
      - cmd/bent/scripts/testjson
      - .github/workflows/llgo-binary-size-pages.yml
      - .github/workflows/llgo-runtime-performance.yml
      - .github/workflows/llgo-open-source-compatibility.yml
      # ci/llgo-size/llgo-version.env is intentionally not ignored: changing
      # the committed LLGo pin must trigger a binary-size build.
  pull_request:
    paths-ignore:
      - ci/llgo-size/site/**
      - ci/llgo-size/publish-site.sh
      - ci/llgo-size/prepare-pages-branch.sh
      - ci/llgo-performance/**
      - ci/llgo-compatibility/**
      - cmd/bent/configs/benchmarks-llgo-performance.toml
      - cmd/bent/configs/configurations-llgo-performance.toml
      - cmd/bent/configs/benchmarks-llgo-compatibility.toml
      - cmd/bent/configs/configurations-llgo-compatibility.toml
      - cmd/bent/scripts/testjson
      - .github/workflows/llgo-binary-size-pages.yml
      - .github/workflows/llgo-runtime-performance.yml
      - .github/workflows/llgo-open-source-compatibility.yml
  # GitHub evaluates repository-dispatch workflows from the receiving
  # repository's default branch. Merge this workflow there before enabling
  # the sender in xgo-dev/llgo.
  repository_dispatch:
    types: [llgo-main-updated]
  workflow_dispatch:
    inputs:
      llgo_commit:
        description: Optional full xgo-dev/llgo commit SHA to benchmark
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  update-pin:
    if: github.event_name == 'repository_dispatch'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    concurrency:
      # Pin updates may be coalesced because the file only records the latest
      # LLGo main revision. The benchmark job below is not part of this queue:
      # every distinct dispatched LLGo commit still gets its own result.
      group: llgo-binary-size-pin
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # A coalesced pin update can start after main has advanced. Always
          # rebuild its one-file commit from the current branch tip.
          ref: main
          fetch-depth: 0

      - name: Update the committed LLGo pin
        env:
          DISPATCH_SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository }}
          DISPATCH_LLGO_REPOSITORY: ${{ github.event.client_payload.llgo_repository }}
          DISPATCH_LLGO_COMMIT: ${{ github.event.client_payload.llgo_commit }}
        run: |
          set -euo pipefail
          if [[ "$DISPATCH_SOURCE_REPOSITORY" != "xgo-dev/llgo" || \
                "$DISPATCH_LLGO_REPOSITORY" != "xgo-dev/llgo" ]]; then
            echo "refusing binary-size dispatch from ${DISPATCH_SOURCE_REPOSITORY:-unknown}" >&2
            exit 1
          fi
          if [[ ! "$DISPATCH_LLGO_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid dispatched LLGo commit: ${DISPATCH_LLGO_COMMIT:-missing}" >&2
            exit 1
          fi

          # A newer notification may replace an older pending pin update. Pin
          # the current LLGo main tip so a delayed notification cannot move
          # the committed default backwards.
          target_commit="$(git ls-remote \
            "https://github.com/${DISPATCH_LLGO_REPOSITORY}.git" \
            refs/heads/main | awk 'NR == 1 { print $1 }')"
          if [[ ! "$target_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "could not resolve ${DISPATCH_LLGO_REPOSITORY} main" >&2
            exit 1
          fi
          echo "Pinning current LLGo main $target_commit (notification requested $DISPATCH_LLGO_COMMIT)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          pin_ready=false
          for attempt in 1 2 3 4; do
            # Recreate the one-file commit from the latest main after every
            # rejected push. This preserves unrelated commits that land while
            # a dispatch is queued or running.
            git fetch --no-tags origin main
            git checkout --detach origin/main

            current_repository="$(awk -F= '$1 == "LLGO_REPOSITORY" { print $2 }' ci/llgo-size/llgo-version.env)"
            current_commit="$(awk -F= '$1 == "LLGO_COMMIT" { print $2 }' ci/llgo-size/llgo-version.env)"
            if [[ "$current_repository" == "$DISPATCH_LLGO_REPOSITORY" && \
                  "$current_commit" == "$target_commit" ]]; then
              echo "LLGo pin is already ${DISPATCH_LLGO_REPOSITORY}@${target_commit}"
              pin_ready=true
              break
            fi

            sed -i \
              -e "s|^LLGO_REPOSITORY=.*|LLGO_REPOSITORY=${DISPATCH_LLGO_REPOSITORY}|" \
              -e "s/^LLGO_COMMIT=.*/LLGO_COMMIT=${target_commit}/" \
              ci/llgo-size/llgo-version.env
            git add ci/llgo-size/llgo-version.env
            git commit -m "ci: pin LLGo ${target_commit:0:12}"
            if git push origin HEAD:main; then
              pin_ready=true
              break
            fi

            if [[ "$attempt" -eq 4 ]]; then
              echo "failed to update the LLGo pin after $attempt attempts" >&2
              exit 1
            fi
            echo "main advanced during pin update; retrying from origin/main"
            sleep $((attempt * 2))
          done

          if [[ "$pin_ready" != true ]]; then
            echo "LLGo pin update did not reach a terminal state" >&2
            exit 1
          fi

  pr-scope:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    outputs:
      full_matrix: ${{ steps.changed.outputs.full_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect an LLGo pin or benchmark-case change
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet "$BASE_SHA" "$PR_SHA" -- \
              ci/llgo-size/llgo-version.env \
              ci/llgo-size/bin/go \
              cmd/bent \
              ':(exclude)cmd/bent/configs/benchmarks-llgo-performance.toml' \
              ':(exclude)cmd/bent/configs/configurations-llgo-performance.toml' \
              ':(exclude)cmd/bent/configs/benchmarks-llgo-compatibility.toml' \
              ':(exclude)cmd/bent/configs/configurations-llgo-compatibility.toml' \
              ':(exclude)cmd/bent/scripts/testjson' \
              cmd/bent/configs/benchmarks-llgo-size.toml \
              cmd/bent/configs/configurations-llgo-size.toml \
              cmd/bent/configs/suites.toml \
              ci/llgo-wasm-size; then
            echo 'full_matrix=false' >> "$GITHUB_OUTPUT"
            echo 'The PR does not change the LLGo pin, Bent, or benchmark cases; only Go validation will run.'
          else
            echo 'full_matrix=true' >> "$GITHUB_OUTPUT"
            echo 'The PR changes the LLGo pin, Bent, or benchmark cases; the full matrix will run without publishing.'
          fi

  binary-size:
    if: >-
      always() &&
      (github.event_name != 'pull_request' || needs.pr-scope.outputs.full_matrix == 'true') &&
      !(github.event_name == 'push' && github.actor == 'github-actions[bot]' &&
        startsWith(github.event.head_commit.message, 'ci: pin LLGo '))
    needs: pr-scope
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      # Different LLGo revisions never share a pending slot. Duplicate
      # notifications for the same revision may be coalesced safely because
      # published history is keyed by the full LLGo commit.
      group: llgo-binary-size-${{ github.event.client_payload.llgo_commit || inputs.llgo_commit || github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned toolchain versions
        env:
          DISPATCH_SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository }}
          DISPATCH_LLGO_REPOSITORY: ${{ github.event.client_payload.llgo_repository }}
          DISPATCH_LLGO_COMMIT: ${{ github.event.client_payload.llgo_commit }}
          MANUAL_LLGO_COMMIT: ${{ inputs.llgo_commit }}
        run: |
          set -euo pipefail
          set -a
          source ci/llgo-size/llgo-version.env
          set +a

          if [[ "$GITHUB_EVENT_NAME" == "repository_dispatch" ]]; then
            if [[ "$DISPATCH_SOURCE_REPOSITORY" != "xgo-dev/llgo" || \
                  "$DISPATCH_LLGO_REPOSITORY" != "xgo-dev/llgo" ]]; then
              echo "refusing binary-size dispatch from ${DISPATCH_SOURCE_REPOSITORY:-unknown}" >&2
              exit 1
            fi
            if [[ ! "$DISPATCH_LLGO_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
              echo "invalid dispatched LLGo commit: ${DISPATCH_LLGO_COMMIT:-missing}" >&2
              exit 1
            fi
            LLGO_REPOSITORY="$DISPATCH_LLGO_REPOSITORY"
            LLGO_COMMIT="$DISPATCH_LLGO_COMMIT"
          elif [[ -n "$MANUAL_LLGO_COMMIT" ]]; then
            if [[ ! "$MANUAL_LLGO_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
              echo "manual LLGo commit must be a full 40-character SHA" >&2
              exit 1
            fi
            LLGO_REPOSITORY=xgo-dev/llgo
            LLGO_COMMIT="$MANUAL_LLGO_COMMIT"
          fi

          {
            printf 'LLGO_REPOSITORY=%s\n' "$LLGO_REPOSITORY"
            printf 'LLGO_COMMIT=%s\n' "$LLGO_COMMIT"
            printf 'LLGO_BUILD_GO_VERSION=%s\n' "$LLGO_BUILD_GO_VERSION"
            printf 'GO_VERSION=%s\n' "$GO_VERSION"
            printf 'LLVM_VERSION=%s\n' "$LLVM_VERSION"
            printf 'TINYGO_VERSION=%s\n' "$TINYGO_VERSION"
            printf 'TINYGO_LINUX_AMD64_SHA256=%s\n' "$TINYGO_LINUX_AMD64_SHA256"
            printf 'BINARYEN_VERSION=%s\n' "$BINARYEN_VERSION"
            printf 'BINARYEN_LINUX_AMD64_SHA256=%s\n' "$BINARYEN_LINUX_AMD64_SHA256"
          } >> "$GITHUB_ENV"
          mkdir -p .ci
          printf '%s\n' "$GO_VERSION" > .ci/go-version

      - uses: actions/setup-go@v5
        with:
          go-version-file: .ci/go-version
          # Per-case compile times use Bent's standard-library-only cache
          # seeds. Do not import a previous CI run's Go build cache.
          cache: false

      - name: Validate the WASM pipeline and site
        run: |
          set -euo pipefail
          python3 -m unittest discover -s ci/llgo-wasm-size -p 'test_*.py' -v
          node --test ci/llgo-wasm-size/test_wasm_site.cjs
          shellcheck ci/llgo-wasm-size/run.sh ci/llgo-size/publish.sh ci/llgo-size/publish-site.sh

      - name: Install LLVM and CMake dependencies
        run: |
          set -euo pipefail
          source ci/llgo-size/timing.sh

          # GitHub-hosted runners prefer an Azure mirror through apt's dynamic
          # mirror list. A bad mirror can leave apt-get update silent until the
          # whole job times out, so use Ubuntu's HTTPS archive directly.
          ubuntu_sources=/etc/apt/sources.list.d/ubuntu.sources
          if [[ -f "$ubuntu_sources" ]]; then
            sudo sed -i \
              -e 's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu|g' \
              -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              "$ubuntu_sources"
          fi

          apt_options=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
            -o DPkg::Lock::Timeout=60
          )
          ci/llgo-size/setup-llvm-apt.sh
          time_command "APT package index update" \
            sudo timeout --kill-after=30s 5m apt-get "${apt_options[@]}" update
          time_command "APT package installation" \
            sudo timeout --kill-after=30s 15m apt-get "${apt_options[@]}" install -y \
              cmake "clang-${LLVM_VERSION}" "lld-${LLVM_VERSION}" \
              "llvm-${LLVM_VERSION}-dev" ninja-build \
              libuv1-dev libgc-dev libffi-dev

      - name: Install pinned Emscripten for LLGo WASM post-link processing
        uses: emscripten-core/setup-emsdk@667eb33f24e84e7f362c16d8d7fff0629a73e15e # v15
        with:
          version: "4.0.21"

      - name: Install pinned TinyGo
        run: |
          set -euo pipefail
          archive="tinygo${TINYGO_VERSION}.linux-amd64.tar.gz"
          curl --fail --location --retry 3 --retry-all-errors \
            --output ".ci/$archive" \
            "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/${archive}"
          printf '%s  %s\n' "$TINYGO_LINUX_AMD64_SHA256" ".ci/$archive" | sha256sum --check --strict
          tar -C .ci -xzf ".ci/$archive"

          binaryen_archive="binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          curl --fail --location --retry 3 --retry-all-errors \
            --output ".ci/$binaryen_archive" \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/${binaryen_archive}"
          printf '%s  %s\n' "$BINARYEN_LINUX_AMD64_SHA256" ".ci/$binaryen_archive" | sha256sum --check --strict
          tar -C .ci -xzf ".ci/$binaryen_archive"

          export PATH="$GITHUB_WORKSPACE/.ci/binaryen-version_${BINARYEN_VERSION}/bin:$PATH"
          .ci/tinygo/bin/tinygo version
          wasm-opt --version
          llgo_wasm_opt="$EMSDK/upstream/bin/wasm-opt"
          [[ -x "$llgo_wasm_opt" ]]
          "$llgo_wasm_opt" --version
          llgo_wasm_opt_help="$("$llgo_wasm_opt" --help)"
          grep -Fq -- '--translate-to-exnref' <<< "$llgo_wasm_opt_help"

      - name: Check out pinned LLGo
        run: |
          set -euo pipefail
          source ci/llgo-size/timing.sh
          time_command "Clone pinned LLGo repository" \
            git clone --progress --filter=blob:none --no-checkout "https://github.com/${LLGO_REPOSITORY}.git" .ci/llgo
          time_command "Fetch pinned LLGo commit" \
            git -C .ci/llgo fetch --progress --no-tags --depth=1 origin "$LLGO_COMMIT"
          time_command "Check out pinned LLGo commit" \
            git -C .ci/llgo checkout --detach "$LLGO_COMMIT"
          # The commit-specific depth-1 fetch above makes this repository
          # shallow. Unshallow it before assigning first-parent positions;
          # otherwise every run appears to be main index 1.
          git -C .ci/llgo fetch --no-tags --unshallow origin main
          git -C .ci/llgo rev-list --first-parent --reverse origin/main > .ci/llgo-main-history.txt
          llgo_main_index="$(awk -v commit="$LLGO_COMMIT" '$0 == commit { print NR; exit }' \
            .ci/llgo-main-history.txt)"
          llgo_committed_at="$(git -C .ci/llgo show -s --format=%cI "$LLGO_COMMIT")"
          printf 'LLGO_MAIN_INDEX=%s\n' "$llgo_main_index" >> "$GITHUB_ENV"
          printf 'LLGO_COMMITTED_AT=%s\n' "$llgo_committed_at" >> "$GITHUB_ENV"
      - name: Build LLGo and the LTO plugin
        run: |
          set -euo pipefail
          source ci/llgo-size/timing.sh
          llgo_build_toolchain="go${LLGO_BUILD_GO_VERSION#go}"
          export PATH="/usr/lib/llvm-${LLVM_VERSION}/bin:$PATH"
          export LLGO_ROOT="$GITHUB_WORKSPACE/.ci/llgo"
          (
            cd "$LLGO_ROOT"
            time_command "Download LLGo Go modules" \
              env GOTOOLCHAIN="$llgo_build_toolchain" go mod download -x
            time_command "Build LLGo command" \
              env GOTOOLCHAIN="$llgo_build_toolchain" go build -tags=dev -o "$LLGO_ROOT/llgo" ./cmd/llgo
          )
          time_command "Configure LLGo LTO plugin" \
            cmake -S "$LLGO_ROOT/ltoplugin" -B "$LLGO_ROOT/ltoplugin/build" \
              -DLLVM_DIR="/usr/lib/llvm-${LLVM_VERSION}/lib/cmake/llvm" \
              -DCMAKE_BUILD_TYPE=Release -G Ninja
          time_command "Build LLGo LTO plugin" \
            cmake --build "$LLGO_ROOT/ltoplugin/build" --parallel 2 --verbose

      - name: Compare Go, TinyGo, and LLGo WASM application sizes
        env:
          LLGO_BIN: ${{ github.workspace }}/.ci/llgo/llgo
          LLGO_ROOT: ${{ github.workspace }}/.ci/llgo
        run: |
          set -euo pipefail
          go_toolchain="go${GO_VERSION#go}"
          GOROOT="$(GOTOOLCHAIN="$go_toolchain" go env GOROOT)"
          export GOROOT
          # Linux TinyGo bundles an older wasm-opt in its own bin directory.
          # Resolve the independently pinned Binaryen before that directory.
          export PATH="$GOROOT/bin:$GITHUB_WORKSPACE/.ci/binaryen-version_${BINARYEN_VERSION}/bin:$GITHUB_WORKSPACE/.ci/tinygo/bin:/usr/lib/llvm-${LLVM_VERSION}/bin:$PATH"
          export LLVM_CONFIG="/usr/lib/llvm-${LLVM_VERSION}/bin/llvm-config"
          export LLGO_WASMOPT="$EMSDK/upstream/bin/wasm-opt"
          ci/llgo-wasm-size/run.sh .ci/wasm-run
          cat .ci/wasm-run/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload WASM binary-size results
        uses: actions/upload-artifact@v4
        with:
          name: go-tinygo-llgo-wasm-size
          path: .ci/wasm-run
          if-no-files-found: error

      - name: Build six binary-size configurations with Bent
        env:
          LLGO_BIN: ${{ github.workspace }}/.ci/llgo/llgo
          LLGO_LTO_PLUGIN: ${{ github.workspace }}/.ci/llgo/ltoplugin/build/LLGOLTOPlugin.so
          LLGO_ROOT: ${{ github.workspace }}/.ci/llgo
        run: |
          set -euo pipefail
          source ci/llgo-size/timing.sh
          GOROOT="$(go env GOROOT)"
          export GOROOT
          export PATH="$GOROOT/bin:/usr/lib/llvm-${LLVM_VERSION}/bin:$PATH"
          echo "[toolchain] selected llvm-config:"
          llvm-config --version
          echo "[toolchain] selected clang++:"
          clang++ --version
          time_command "Build Bent command" go build -o .ci/bent ./cmd/bent
          mkdir -p .ci/bent-run
          export BENT_REAL_GO="$GOROOT/bin/go"
          export BENT_TIMING_LOG="$GITHUB_WORKSPACE/.ci/bent-run/download-timings.log"
          export PATH="$GITHUB_WORKSPACE/ci/llgo-size/bin:$PATH"
          print_download_log() {
            if [[ -s "$BENT_TIMING_LOG" ]]; then
              echo "::group::Bent dependency download timings and output"
              cat "$BENT_TIMING_LOG"
              echo "::endgroup::"
            else
              echo "[timing] Bent did not record dependency downloads"
            fi
          }
          trap print_download_log EXIT
          (
            cd .ci/bent-run
            time_command "Bent initialize run directory" \
              "$GITHUB_WORKSPACE/.ci/bent" -I
            time_command "Bent dependency acquisition and six-configuration build" \
              "$GITHUB_WORKSPACE/.ci/bent" -v -report-build-time -build-only \
                -B=benchmarks-llgo-size.toml \
                -C=configurations-llgo-size.toml
          )
          time_command "Generate binary-size report" \
            bash -c "set -o pipefail; ci/llgo-size/report.sh .ci/bent-run | tee -a \"$GITHUB_STEP_SUMMARY\""
      - name: Upload binary-size results
        uses: actions/upload-artifact@v4
        with:
          name: llgo-binary-size
          path: .ci/bent-run/results
          if-no-files-found: error

      - name: Publish binary-size history to Pages
        if: github.ref == 'refs/heads/main'
        env:
          PAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          published=false
          for attempt in 1 2 3 4; do
            pages_dir="$GITHUB_WORKSPACE/.ci/pages-$attempt"
            bash ci/llgo-size/prepare-pages-branch.sh \
              "$pages_dir" \
              "https://x-access-token:${PAGES_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            if ci/llgo-size/publish.sh \
                .ci/bent-run/results \
                "$pages_dir" \
                ci/llgo-size/site \
                .ci/llgo-main-history.txt \
                .ci/wasm-run; then
              published=true
              break
            fi
            echo "Pages advanced during publication; retrying from its latest tip"
            sleep $((attempt * 2))
          done
          if [[ "$published" != true ]]; then
            echo "failed to publish binary-size history after 4 attempts" >&2
            exit 1
          fi
  deploy-pages:
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' && needs.binary-size.result == 'success'
    needs: binary-size
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out Pages source
        uses: actions/checkout@v4
        with:
          ref: pages
          path: pages-source
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build Pages with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./pages-source
          destination: ./_site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  pr-validation:
    if: >-
      always() && github.event_name == 'pull_request' &&
      needs.pr-scope.result == 'success' && needs.pr-scope.outputs.full_matrix != 'true'
    needs: pr-scope
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Read the PR validation Go version
        run: |
          set -euo pipefail
          source ci/llgo-size/llgo-version.env
          mkdir -p .ci
          printf '%s\n' "$GO_VERSION" > .ci/go-version

      - uses: actions/setup-go@v5
        with:
          go-version-file: .ci/go-version

      - name: Validate the WASM applications and LLGo-size cases with Go
        run: |
          set -euo pipefail
          source ci/llgo-size/llgo-version.env
          python3 -m unittest discover -s ci/llgo-wasm-size -p 'test_*.py' -v
          node --test ci/llgo-wasm-size/test_wasm_site.cjs
          shellcheck ci/llgo-wasm-size/run.sh
          (
            cd ci/llgo-wasm-size/apps
            GOTOOLCHAIN="go${GO_VERSION#go}" go test ./...
            mkdir -p "$GITHUB_WORKSPACE/.ci/wasm-go-validation"
            while IFS=$'\t' read -r app_id _command source _provenance _kind _description _tinygo; do
              [[ "$app_id" != "id" ]] || continue
              (
                cd "$source"
                GOTOOLCHAIN="go${GO_VERSION#go}" GOOS=wasip1 GOARCH=wasm \
                  go build -o "$GITHUB_WORKSPACE/.ci/wasm-go-validation/$app_id.wasm" .
              )
            done < ../apps.tsv
          )
          go build -o .ci/bent ./cmd/bent
          mkdir -p .ci/bent-pr
          (
            cd .ci/bent-pr
            "$GITHUB_WORKSPACE/.ci/bent" -I
            "$GITHUB_WORKSPACE/.ci/bent" -v \
              -B=benchmarks-llgo-size.toml \
              -C=configurations-llgo-size.toml \
              -c=Go
          )
